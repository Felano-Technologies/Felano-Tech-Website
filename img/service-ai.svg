<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="g4b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <!-- Brain / neural network center -->
  <circle cx="200" cy="140" r="60" fill="url(#g4b)" stroke="url(#g4)" stroke-width="2"/>
  <circle cx="200" cy="140" r="40" fill="white" stroke="url(#g4)" stroke-width="1.5"/>
  <!-- Neural nodes inside -->
  <circle cx="185" cy="125" r="5" fill="url(#g4)" opacity="0.7"/>
  <circle cx="215" cy="125" r="5" fill="url(#g4)" opacity="0.5"/>
  <circle cx="200" cy="150" r="6" fill="url(#g4)" opacity="0.8"/>
  <circle cx="185" cy="155" r="4" fill="url(#g4)" opacity="0.4"/>
  <circle cx="215" cy="155" r="4" fill="url(#g4)" opacity="0.4"/>
  <!-- Neural connections -->
  <line x1="185" y1="125" x2="200" y2="150" stroke="url(#g4)" stroke-width="1.5" opacity="0.4"/>
  <line x1="215" y1="125" x2="200" y2="150" stroke="url(#g4)" stroke-width="1.5" opacity="0.4"/>
  <line x1="185" y1="125" x2="215" y2="125" stroke="url(#g4)" stroke-width="1" opacity="0.3"/>
  <line x1="185" y1="155" x2="200" y2="150" stroke="url(#g4)" stroke-width="1" opacity="0.3"/>
  <line x1="215" y1="155" x2="200" y2="150" stroke="url(#g4)" stroke-width="1" opacity="0.3"/>
  <!-- Outer orbit nodes -->
  <circle cx="130" cy="100" r="8" fill="url(#g4b)" stroke="url(#g4)" stroke-width="1"/>
  <circle cx="270" cy="100" r="8" fill="url(#g4b)" stroke="url(#g4)" stroke-width="1"/>
  <circle cx="130" cy="180" r="8" fill="url(#g4b)" stroke="url(#g4)" stroke-width="1"/>
  <circle cx="270" cy="180" r="8" fill="url(#g4b)" stroke="url(#g4)" stroke-width="1"/>
  <!-- Orbit connections -->
  <line x1="137" y1="104" x2="165" y2="120" stroke="url(#g4)" stroke-width="1" opacity="0.2" stroke-dasharray="4 3"/>
  <line x1="263" y1="104" x2="235" y2="120" stroke="url(#g4)" stroke-width="1" opacity="0.2" stroke-dasharray="4 3"/>
  <line x1="137" y1="176" x2="165" y2="160" stroke="url(#g4)" stroke-width="1" opacity="0.2" stroke-dasharray="4 3"/>
  <line x1="263" y1="176" x2="235" y2="160" stroke="url(#g4)" stroke-width="1" opacity="0.2" stroke-dasharray="4 3"/>
  <!-- Chart/dashboard below -->
  <rect x="120" y="220" width="160" height="50" rx="8" fill="white" stroke="url(#g4)" stroke-width="1.5"/>
  <!-- Bar chart -->
  <rect x="140" y="250" width="12" height="10" rx="2" fill="url(#g4)" opacity="0.3"/>
  <rect x="158" y="242" width="12" height="18" rx="2" fill="url(#g4)" opacity="0.5"/>
  <rect x="176" y="235" width="12" height="25" rx="2" fill="url(#g4)" opacity="0.7"/>
  <rect x="194" y="240" width="12" height="20" rx="2" fill="url(#g4)" opacity="0.4"/>
  <rect x="212" y="232" width="12" height="28" rx="2" fill="url(#g4)" opacity="0.6"/>
  <rect x="230" y="238" width="12" height="22" rx="2" fill="url(#g4)" opacity="0.45"/>
  <!-- Label -->
  <rect x="135" y="228" width="40" height="4" rx="2" fill="url(#g4)" opacity="0.3"/>
  <!-- Connection from brain to chart -->
  <line x1="200" y1="200" x2="200" y2="220" stroke="url(#g4)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.3"/>
  <!-- Floating data points -->
  <circle cx="80" cy="60" r="3" fill="url(#g4)" opacity="0.3"/>
  <circle cx="60" cy="80" r="2" fill="url(#g4)" opacity="0.2"/>
  <circle cx="320" cy="60" r="3" fill="url(#g4)" opacity="0.3"/>
  <circle cx="340" cy="80" r="2" fill="url(#g4)" opacity="0.2"/>
  <circle cx="90" cy="240" r="2" fill="url(#g4)" opacity="0.15"/>
  <circle cx="310" cy="240" r="2" fill="url(#g4)" opacity="0.15"/>
</svg>
