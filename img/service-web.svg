<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="g1b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- Monitor -->
  <rect x="60" y="40" width="280" height="180" rx="12" fill="white" stroke="url(#g1)" stroke-width="2"/>
  <rect x="60" y="40" width="280" height="32" rx="12" fill="url(#g1b)"/>
  <!-- Dots -->
  <circle cx="80" cy="56" r="4" fill="#F43F5E" opacity="0.8"/>
  <circle cx="94" cy="56" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="108" cy="56" r="4" fill="#10B981" opacity="0.8"/>
  <!-- Code lines -->
  <rect x="80" y="90" width="100" height="6" rx="3" fill="url(#g1)" opacity="0.6"/>
  <rect x="80" y="106" width="140" height="6" rx="3" fill="url(#g1)" opacity="0.3"/>
  <rect x="80" y="122" width="80" height="6" rx="3" fill="url(#g1)" opacity="0.45"/>
  <rect x="80" y="138" width="120" height="6" rx="3" fill="url(#g1)" opacity="0.2"/>
  <rect x="80" y="154" width="90" height="6" rx="3" fill="url(#g1)" opacity="0.5"/>
  <!-- Side panel -->
  <rect x="240" y="85" width="80" height="100" rx="6" fill="url(#g1b)" stroke="url(#g1)" stroke-width="1" opacity="0.5"/>
  <rect x="252" y="97" width="56" height="4" rx="2" fill="url(#g1)" opacity="0.4"/>
  <rect x="252" y="109" width="40" height="4" rx="2" fill="url(#g1)" opacity="0.25"/>
  <rect x="252" y="121" width="48" height="4" rx="2" fill="url(#g1)" opacity="0.35"/>
  <!-- Stand -->
  <rect x="170" y="220" width="60" height="8" rx="2" fill="url(#g1)" opacity="0.3"/>
  <rect x="190" y="220" width="20" height="20" rx="2" fill="url(#g1)" opacity="0.2"/>
  <rect x="155" y="238" width="90" height="6" rx="3" fill="url(#g1)" opacity="0.15"/>
  <!-- Floating elements -->
  <rect x="20" y="100" width="28" height="28" rx="6" fill="url(#g1)" opacity="0.1"/>
  <text x="28" y="119" font-size="14" fill="url(#g1)" opacity="0.7" font-family="monospace">&lt;/&gt;</text>
  <circle cx="365" cy="90" r="16" fill="url(#g1b)" stroke="url(#g1)" stroke-width="1"/>
  <text x="357" y="95" font-size="12" fill="url(#g1)" opacity="0.7" font-family="monospace">{ }</text>
</svg>
