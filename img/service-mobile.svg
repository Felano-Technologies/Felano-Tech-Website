<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g2b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <!-- Phone -->
  <rect x="140" y="20" width="120" height="240" rx="20" fill="white" stroke="url(#g2)" stroke-width="2.5"/>
  <!-- Notch -->
  <rect x="175" y="30" width="50" height="6" rx="3" fill="url(#g2)" opacity="0.2"/>
  <!-- Screen content -->
  <rect x="155" y="50" width="90" height="16" rx="4" fill="url(#g2b)"/>
  <rect x="160" y="54" width="50" height="8" rx="4" fill="url(#g2)" opacity="0.5"/>
  <!-- App cards -->
  <rect x="155" y="76" width="90" height="40" rx="8" fill="url(#g2b)" stroke="url(#g2)" stroke-width="0.5"/>
  <rect x="165" y="86" width="40" height="4" rx="2" fill="url(#g2)" opacity="0.5"/>
  <rect x="165" y="96" width="60" height="4" rx="2" fill="url(#g2)" opacity="0.3"/>
  <rect x="155" y="124" width="90" height="40" rx="8" fill="url(#g2b)" stroke="url(#g2)" stroke-width="0.5"/>
  <rect x="165" y="134" width="35" height="4" rx="2" fill="url(#g2)" opacity="0.5"/>
  <rect x="165" y="144" width="55" height="4" rx="2" fill="url(#g2)" opacity="0.3"/>
  <!-- Bottom nav -->
  <rect x="155" y="210" width="90" height="8" rx="4" fill="url(#g2b)"/>
  <circle cx="175" cy="214" r="3" fill="url(#g2)" opacity="0.6"/>
  <circle cx="200" cy="214" r="3" fill="url(#g2)" opacity="0.3"/>
  <circle cx="225" cy="214" r="3" fill="url(#g2)" opacity="0.3"/>
  <!-- Home indicator -->
  <rect x="180" y="240" width="40" height="4" rx="2" fill="url(#g2)" opacity="0.2"/>
  <!-- Floating elements -->
  <rect x="50" y="60" width="60" height="60" rx="14" fill="url(#g2b)" stroke="url(#g2)" stroke-width="1"/>
  <text x="65" y="97" font-size="22" fill="url(#g2)" opacity="0.6">📱</text>
  <rect x="290" y="80" width="60" height="60" rx="14" fill="url(#g2b)" stroke="url(#g2)" stroke-width="1"/>
  <text x="305" y="117" font-size="22" fill="url(#g2)" opacity="0.6">⚡</text>
  <!-- Connecting dots -->
  <circle cx="120" cy="150" r="4" fill="url(#g2)" opacity="0.2"/>
  <circle cx="280" cy="150" r="4" fill="url(#g2)" opacity="0.2"/>
  <line x1="124" y1="150" x2="140" y2="150" stroke="url(#g2)" stroke-width="1" opacity="0.15" stroke-dasharray="4 2"/>
  <line x1="260" y1="150" x2="276" y2="150" stroke="url(#g2)" stroke-width="1" opacity="0.15" stroke-dasharray="4 2"/>
</svg>
